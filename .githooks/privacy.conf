# This repository's part of the shared privacy check. scripts/privacy_check.sh and
# .githooks/pre-push are the same in all three repositories (owned by GATBOX); what differs
# is here. One setting per line, # comments and blank lines skipped:
#   forbid=<extended regex>   a path this repository must never commit, on top of the shared
#                             list (matched case-insensitively against each committed path)

# Uploaded files (photos, receipts, documents), backups and the instance folder.
forbid=(^|/)(files|backups|instance)/
