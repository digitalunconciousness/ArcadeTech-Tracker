{% extends "base.html" %}
{% from "_forms.html" import field %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Sign in</h1>
  <form method="post" novalidate>
    {{ form.csrf_token }}
    {{ field(form.username, autocomplete="username", autofocus=True) }}
    {{ field(form.password, autocomplete="current-password") }}
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
