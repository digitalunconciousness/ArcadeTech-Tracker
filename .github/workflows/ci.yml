name: ci

# On every push to main and every PR (Actions starts jobs on this account again,
# 2026-11-21; it was manual-only from 2026-10-08), weekly, and by hand. The local pytest
# run and the privacy check are still shown before every push: this run's privacy check
# has only the generic checks, not the owner's patterns.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change on GitHub's side (a new runner image, a new postgres:17) shows up
  # here rather than in the middle of somebody's PR.
  schedule:
    - cron: '7 11 * * 0'
  workflow_dispatch:
  # release.yml runs this whole workflow on a v* tag before it makes the release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17   # prod major
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      PGPASSWORD: postgres
      SHOP_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      SHOP_PG_BIN: ${{ github.workspace }}/.ci-pgbin
    # The repository is checked out as shop-hub/, with Gatbox/ and cabcrawl/ beside it, so
    # the sibling tests (test_api_v1_contract, test_library_contract, test_agent_rules,
    # test_antislop, test_privacy_check) compare every vendored copy with the other two
    # repositories' default branches. GATBOX owns them: when this copy differs, Gatbox's is
    # the one to copy.
    defaults:
      run:
        working-directory: shop-hub
    steps:
      # TODO(owner): pin the actions to their release commit SHAs (git ls-remote --tags);
      # Dependabot keeps them current either way.
      - uses: actions/checkout@v7
        with:
          path: shop-hub
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: digitalunconciousness/Gatbox
          path: Gatbox
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: digitalunconciousness/cabcrawl
          path: cabcrawl
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: System libraries (WeasyPrint) and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 shellcheck

      - name: pg 17 client tools (run from the postgres:17 image)
        run: |
          mkdir -p "$SHOP_PG_BIN"
          for t in pg_dump pg_restore psql; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e PGPASSWORD postgres:17 %s "$@"\n' "$t" > "$SHOP_PG_BIN/$t"
            chmod +x "$SHOP_PG_BIN/$t"
          done
          "$SHOP_PG_BIN/pg_dump" --version

      - name: Install (hash-checked)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: The siblings under comparison
        run: for r in Gatbox cabcrawl; do echo "$r at $(git -C ../$r log -1 --format='%h %s')"; done

      - name: ruff
        run: ruff check .

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh deploy/*.sh .githooks/pre-push docs/cloud-setup.sh

      - name: pytest
        run: pytest

      - name: privacy check (generic checks; owner patterns are local-only)
        env:
          SHOP_PRIVACY_CI: "1"
        run: scripts/privacy_check.sh "origin/main..HEAD"
