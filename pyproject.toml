[project]
name = "shop-hub"
version = "0.0.0"
requires-python = ">=3.13"
description = "ArcadeTech Tracker: the shop's system of record"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
